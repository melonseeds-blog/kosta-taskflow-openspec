# Alembic Configuration File
# https://alembic.sqlalchemy.org/

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template for revision file names
file_template = %%(rev)s_%%(slug)s

# Truncate length for slug
truncate_slug_length = 40

# Timezone for revision dates
timezone = UTC

# Sys path - prepend current directory
prepend_sys_path = .

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL is read from environment variable in env.py
# Do NOT hardcode real credentials here.
# env.py reads DATABASE_URL from the environment (or .env file).
sqlalchemy.url = sqlite:///./taskflow.db


[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
