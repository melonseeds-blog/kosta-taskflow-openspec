<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 403 접근 불가</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0d2137] flex items-center justify-center px-4">

  <div class="text-center flex flex-col items-center gap-6 max-w-md w-full">

    <!-- 금지 아이콘 원형 -->
    <div class="w-28 h-28 bg-red-600/20 border-2 border-red-500/40 rounded-full flex items-center justify-center">
      <svg class="w-14 h-14 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
      </svg>
    </div>

    <!-- 403 텍스트 -->
    <div>
      <p class="text-red-400 text-7xl font-extrabold tracking-tight">403</p>
      <h1 class="text-white text-xl font-bold mt-2">이 팀에 접근할 권한이 없습니다.</h1>
    </div>

    <!-- 부가 설명 -->
    <p class="text-gray-400 text-sm leading-relaxed">
      요청하신 리소스에 접근할 권한이 없습니다.<br>
      올바른 팀 계정으로 로그인했는지 확인해 주세요.<br>
      문제가 지속되면 팀 관리자에게 문의하세요.
    </p>

    <!-- 돌아가기 버튼 -->
    <button
      onclick="window.location.href='/app'"
      class="bg-[#00b4a0] hover:bg-teal-500 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center gap-2 text-sm"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      내 팀으로 돌아가기
    </button>

  </div>

</body>
</html>
