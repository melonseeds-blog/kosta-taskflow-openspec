<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 팀 선택</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#00b4a0', dark: '#0f3444', mid: '#0d2137' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- 토스트 컨테이너 -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- ─── 헤더 ─── -->
  <header class="bg-[#0f3444] shadow-md">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="bg-[#00b4a0] rounded-xl px-4 py-1.5">
        <span class="text-white text-lg font-bold tracking-wide">TaskFlow</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="header-email" class="text-gray-300 text-sm hidden sm:block"></span>
        <button
          onclick="handleLogout()"
          class="text-sm text-gray-300 hover:text-white border border-gray-500 hover:border-gray-300 rounded-lg px-3 py-1.5 transition"
        >로그아웃</button>
      </div>
    </div>
  </header>

  <!-- ─── 메인 ─── -->
  <main class="max-w-5xl mx-auto px-6 py-10">

    <!-- 안내 배너 -->
    <div class="bg-teal-50 border border-teal-200 rounded-xl p-4 flex items-center gap-3 mb-8">
      <div class="bg-[#00b4a0] rounded-full p-2 flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <p class="text-teal-800 font-semibold text-sm">아직 팀에 소속되지 않았습니다.</p>
        <p class="text-teal-600 text-xs mt-0.5">새 팀을 만들거나 초대코드로 기존 팀에 합류하세요.</p>
      </div>
    </div>

    <!-- 2열 레이아웃 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- ── 왼쪽: 새 팀 만들기 ── -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-2 mb-5">
          <div class="bg-teal-100 rounded-lg p-2">
            <svg class="w-5 h-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </div>
          <h2 class="text-base font-bold text-gray-800">새 팀 만들기</h2>
        </div>

        <form id="form-create" onsubmit="handleCreateTeam(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">팀 이름</label>
            <input
              id="create-name"
              type="text"
              placeholder="예: 개발 1팀"
              maxlength="50"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
            />
            <p id="create-name-err" class="mt-1 text-xs text-red-500 hidden"></p>
          </div>
          <p id="create-general-err" class="text-sm text-red-500 hidden"></p>
          <button
            id="create-btn"
            type="submit"
            class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed"
          >만들기</button>
        </form>

        <!-- 성공 결과 -->
        <div id="create-result" class="hidden mt-5">
          <div class="bg-teal-50 border border-teal-200 rounded-xl p-4 flex flex-col gap-3">
            <p class="text-xs font-semibold text-teal-700 uppercase tracking-wide">초대코드</p>
            <div class="flex items-center gap-2">
              <span id="invite-code-display"
                class="flex-1 text-center text-2xl font-mono font-bold text-teal-800 bg-white border border-teal-300 rounded-lg py-2 tracking-widest"></span>
              <button
                onclick="copyInviteCode()"
                title="복사"
                class="bg-teal-100 hover:bg-teal-200 text-teal-700 rounded-lg p-2 transition"
              >📋</button>
            </div>
            <p class="text-xs text-teal-600">이 코드를 팀원에게 공유하세요.</p>
          </div>
          <button
            onclick="window.location.href='/app'"
            class="mt-4 w-full bg-[#0f3444] hover:bg-[#163d52] text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2"
          >
            칸반 시작하기
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </button>
        </div>
      </div>

      <!-- ── 오른쪽: 초대코드로 합류 ── -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-2 mb-5">
          <div class="bg-blue-100 rounded-lg p-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
          </div>
          <h2 class="text-base font-bold text-gray-800">초대코드로 합류</h2>
        </div>

        <form id="form-join" onsubmit="handleJoinTeam(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">초대 코드</label>
            <input
              id="join-code"
              type="text"
              placeholder="초대코드 입력 (예: ABC123)"
              maxlength="20"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm font-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
              oninput="this.value = this.value.toUpperCase()"
            />
            <p id="join-code-err" class="mt-1 text-xs text-red-500 hidden"></p>
          </div>
          <p id="join-general-err" class="text-sm text-red-500 hidden"></p>
          <button
            id="join-btn"
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed"
          >합류하기</button>
        </form>

        <!-- 성공 미리보기 -->
        <div id="join-result" class="hidden mt-5">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex flex-col gap-2">
            <p class="text-xs font-semibold text-blue-700 uppercase tracking-wide">팀 정보</p>
            <p id="join-team-name" class="text-lg font-bold text-gray-800"></p>
            <p id="join-team-members" class="text-sm text-gray-500"></p>
          </div>
          <button
            id="join-confirm-btn"
            onclick="confirmJoin()"
            class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2"
          >
            이 팀에 합류
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </button>
        </div>
      </div>

    </div><!-- /grid -->
  </main>

  <script src="/static/api.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    /* ── 진입 가드 ── */
    auth.requireAuth();
    const _user = auth.getUser();
    if (_user && _user.team_id) {
      window.location.href = '/app';
    }

    /* ── 헤더 이메일 표시 ── */
    if (_user) {
      const emailEl = document.getElementById('header-email');
      emailEl.textContent = _user.email || '';
      emailEl.classList.remove('hidden');
    }

    /* ── 로그아웃 ── */
    function handleLogout() {
      auth.clearAuth();
      window.location.href = '/login';
    }

    /* ── 에러 표시 유틸 ── */
    function clearErrors() {
      ['create-name-err','create-general-err','join-code-err','join-general-err'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.textContent = ''; el.classList.add('hidden'); }
      });
    }

    function showErr(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    /* ── 에러 코드 → 메시지 ── */
    function resolveErrMsg(err, context) {
      if (!err) return '오류가 발생했습니다.';
      if (err.status === 400) return '입력 형식이 올바르지 않습니다.';
      if (err.status === 404) return '존재하지 않는 초대코드입니다.';
      if (err.status === 409) return '이미 팀에 소속되어 있습니다.';
      return err.message || '오류가 발생했습니다.';
    }

    /* ── 팀 만들기 ── */
    async function handleCreateTeam(e) {
      e.preventDefault();
      clearErrors();

      const name = document.getElementById('create-name').value.trim();
      const btn  = document.getElementById('create-btn');

      if (!name) {
        showErr('create-name-err', '팀 이름을 입력하세요.');
        return;
      }

      btn.disabled = true;
      btn.textContent = '처리 중...';

      try {
        const data = await api.post('/teams', { name });

        // user 갱신 (team_id 포함)
        const user = auth.getUser();
        if (user) {
          user.team_id = data.id;
          auth.setToken(auth.getToken(), user);
        }

        // 초대코드 표시
        document.getElementById('invite-code-display').textContent = data.invite_code;
        document.getElementById('create-result').classList.remove('hidden');
        document.getElementById('form-create').classList.add('hidden');
        showToast('팀이 생성되었습니다!', 'success');
      } catch (err) {
        showErr('create-general-err', resolveErrMsg(err, 'create'));
        document.getElementById('create-general-err').classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '만들기';
      }
    }

    /* ── 초대코드 복사 ── */
    function copyInviteCode() {
      const code = document.getElementById('invite-code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        showToast('초대코드가 복사되었습니다.', 'success');
      }).catch(() => {
        showToast('복사에 실패했습니다.', 'error');
      });
    }

    /* ── 초대코드 합류 (POST /teams/join 직접 호출) ── */
    async function handleJoinTeam(e) {
      e.preventDefault();
      clearErrors();

      const code = document.getElementById('join-code').value.trim().toUpperCase();
      const btn  = document.getElementById('join-btn');

      if (!code) {
        showErr('join-code-err', '초대코드를 입력하세요.');
        return;
      }

      btn.disabled = true;
      btn.textContent = '처리 중...';
      document.getElementById('join-result').classList.add('hidden');

      try {
        const data = await api.post('/teams/join', { invite_code: code });

        // user의 team_id 갱신
        const user = auth.getUser();
        if (user) {
          user.team_id = data.team.id;
          auth.setToken(auth.getToken(), user);
        }

        document.getElementById('join-team-name').textContent = data.team.name;
        document.getElementById('join-team-members').textContent =
          `멤버 ${data.team.member_count ?? '?'}명`;
        document.getElementById('join-result').classList.remove('hidden');
      } catch (err) {
        showErr('join-general-err', resolveErrMsg(err, 'join'));
        document.getElementById('join-general-err').classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '합류하기';
      }
    }

    /* ── 합류 후 앱으로 이동 ── */
    function confirmJoin() {
      showToast('팀에 합류했습니다!', 'success');
      setTimeout(() => { window.location.href = '/app'; }, 600);
    }
  </script>
</body>
</html>
